<style>
:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--paper:#fbf4ea;--ink:#2a2547;--dim:#675f86;--ora:#ff6b3d;--navy:#26348a;--pink:#ff9fba;--mat:#8fcdb0;--f:"Shippori Mincho","Songti SC","Noto Serif SC",serif;--g:"Zen Maru Gothic","PingFang SC","Noto Sans SC",sans-serif}

@keyframes pop{from{transform:translateY(14px) scale(.96);opacity:0}}
.bp h3{margin:0 0 6px;font:800 22px var(--f)}.bp .bn{font:800 clamp(34px,9vw,56px)/1.1 var(--f);color:var(--ora)}
.pill{display:block;margin:8px 0;padding:8px 12px;border-radius:14px;background:#fff;border:1.5px solid var(--navy)}.pill b{font:800 18px var(--f);color:var(--navy)}.pill span{display:block;font-size:13px;color:var(--dim)}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2.4s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}

<script>

(function(){
var $=function(s){return document.querySelector(s)},M=6e4,f=function(n){return Math.round(n).toLocaleString('en-US')},pd=function(n){return(n<10?'0':'')+n};

var KEY='honmaru-v1',DB;
function mk(name,start,end){return{name:name,start:start,end:end,goal:2000000,tk:3,gpp:50,hpp:10,rstart:310000,rstep:10000,rgem:300,pcap:2000000,logs:[],now:null}}

function A(){return DB.acts[DB.cur]}
/* 可打时段：绝对分钟，跨午夜、重叠忙碌时间均已处理 */
function wins(P,from,to){var aw=[],bz=[],N=Math.ceil(to/1440)+1,w=tp(P.wake),s=tp(P.sleep),d,out=[];if(s<=w)s+=1440;

function calc(){
var a=A(),P=DB.P,base=new Date(a.start);base.setHours(0,0,0,0);
function ab(t){return(t-base)/M}
var s0=ab(new Date(a.start)),e0=ab(new Date(a.end)),nowA=ab(Date.now()),nD=Math.max(1,Math.ceil(e0/1440)),mpg=P.mpg>0?P.mpg:7,rec=P.rec>0?P.rec:24,i;
var W=wins(P,s0,e0),t0=Math.max(nowA,s0),WF=wins(P,t0,e0),N=a.now||{pt:0,h:P.cap,tk:a.tk};

var avF=[],avA=[],slots=[];for(i=0;i<nD+1;i++){avF.push(0);avA.push(0)}
W.forEach(function(w){avA[Math.floor(w[0]/1440)]+=w[1]-w[0]});
WF.forEach(function(w){var t=w[0];avF[Math.floor(w[0]/1440)]+=w[1]-w[0];while(t+mpg<=w[1]){slots.push(t);t+=mpg}});

var days=[],byD={};slots.forEach(function(x){var d=Math.floor(x/1440);if(!byD[d]){byD[d]=[];days.push(d)}byD[d].push(x)});
var rows={},tot={g:0,t:0,b:0,nat:0},last=t0,bi=0,prog=0,R;
function reg(dt){if(h>=P.cap){prog=0;return}prog+=dt;var n=Math.floor(prog/rec);if(h+n>=P.cap){R.nat+=P.cap-h;h=P.cap;prog=0}else{h+=n;prog-=n*rec;R.nat+=n}}

reg(x-last);last=x;var u;

if(u==='g'){R.g++;R.pts+=P.hp;pt+=P.hp}else{R.t++;R.pts+=P.tp;pt+=P.tp}});
R.cum=pt;tot.g+=R.g;tot.t+=R.t;tot.b+=R.b;tot.nat+=R.nat});

today:Math.floor(nowA/1440),n:n,avgPts:sm('pts')/n,avgG:(sm('g')+sm('t'))/n,avgAv:days.reduce(function(s,d){return s+avA[d]},0)/n,

var pa='M0 70C160 0 320 120 520 62S860 10 1000 66',da=' fill="none" stroke-linecap="round" pathLength="100" stroke-dasharray="'+(pct*100)+' 100" style="transition:stroke-dasharray 1.2s"';

<title>本丸出陣手帖</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@500;800&family=Zen+Maru+Gothic:wght@400;500;700&family=Noto+Serif+SC:wght@500;800&family=Noto+Sans+SC:wght@400;500;700&family=Cormorant+Garamond:ital,wght@1,600&display=swap">
<style>
:root{color-scheme:light;--paper:#fff9f1;--ink:#2a2547;--dim:#675f86;--ora:#ff6b3d;--ora2:#e8501f;--navy:#26348a;--pink:#ff9fba;--sky:#8fd3ea;--mat:#8fcdb0;--gold:#e6b04a;--hair:#e4d9ec;
--f:"Shippori Mincho B1","Noto Serif SC","Songti SC",serif;--g:"Zen Maru Gothic","Noto Sans SC","PingFang SC",sans-serif;--en:"Cormorant Garamond","Times New Roman",serif}

main{overflow-x:clip;position:relative;z-index:2;max-width:1120px;margin:0 auto;padding:16px max(16px,env(safe-area-inset-left,0px)) 110px max(16px,env(safe-area-inset-right,0px))}
.top{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px}

button:hover{background:var(--navy);color:#fff}button:active{transform:translateY(1px)}
button.go{background:var(--ora);border-color:var(--ora);color:#fff;font-weight:700}button.go:hover{background:var(--ora2)}
button.sm{padding:3px 12px;font-size:13px}button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:3px solid var(--ora);outline-offset:2px}

/* 首屏 */
.hero{position:relative;display:grid;grid-template-columns:minmax(250px,370px) 1fr;gap:26px 44px;margin:30px 0 14px;align-items:start}
.rib{position:absolute;left:-30px;width:calc(100% + 60px);top:30%;height:130px;z-index:0;pointer-events:none}

.cart{position:relative;aspect-ratio:3/4;filter:drop-shadow(0 26px 26px rgba(38,52,138,.3));cursor:pointer;user-select:none}

.cart .pctv{position:absolute;right:11%;top:22%;z-index:2;writing-mode:vertical-rl;font:800 19px var(--f);color:#fff;letter-spacing:.2em;text-shadow:0 1px 0 rgba(38,52,138,.7)}
.cart .ttl{position:absolute;left:0;right:0;top:14%;text-align:center;font:italic 600 13px var(--en);letter-spacing:.2em;color:var(--navy);z-index:2}

.vt2{position:absolute;right:0;top:26%;z-index:3;writing-mode:vertical-rl;background:#fff;border:2px solid var(--sky);color:#3ba6c4;font:700 14px var(--g);letter-spacing:.3em;padding:10px 5px;border-radius:4px}
.fl2{position:absolute;pointer-events:none;z-index:3}
.petal{position:absolute;width:11px;height:15px;border-radius:70% 0 70% 0;background:#ffb3cb;pointer-events:none;z-index:4;animation:pf 2.6s ease-in forwards}

.tw{animation:tw 2.8s ease-in-out infinite}@keyframes tw{50%{opacity:.25;transform:scale(.7)}}
.tw{transform-box:fill-box;transform-origin:center}
.sway{animation:sw 5s ease-in-out infinite;transform-origin:300px 40px}@keyframes sw{50%{transform:rotate(1.4deg)}}
.side{position:relative;z-index:1;display:grid;gap:18px;min-width:0}
.cdp{position:relative;background:rgba(255,252,246,.96);border:2px solid var(--navy);border-radius:24px;padding:16px 18px 14px;box-shadow:8px 8px 0 var(--ora)}

.tb{height:10px;border-radius:99px;background:#eadff2;overflow:hidden}.tb i{display:block;height:100%;background:repeating-linear-gradient(115deg,var(--ora) 0 12px,var(--pink) 12px 24px);border-radius:99px}
.tbl{display:flex;justify-content:space-between;font-size:12px;color:var(--dim);margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{position:relative;background:rgba(255,255,255,.92);border-radius:16px;padding:10px 12px 10px 16px;border:1.5px solid var(--hair);overflow:hidden;min-width:0}

.tile.w{grid-column:1/-1}
.chip{display:inline-block;padding:1px 10px;border-radius:99px;font:700 13px var(--g);vertical-align:middle}
.chip.ok{background:#d8f2e4;color:#1d7a50}.chip.no{background:#ffe0d6;color:#c2410c}
.dr2{display:flex;height:30px;border-radius:99px;overflow:hidden;border:2px solid var(--navy);background:#fff}
.dr2 i{display:block;height:100%}
.lg2{display:flex;gap:6px 14px;flex-wrap:wrap;font-size:12.5px;color:var(--dim);margin-top:6px}.lg2 span:before{content:"";display:inline-block;width:11px;height:11px;border-radius:3px;background:var(--c);margin-right:5px;vertical-align:-1px}
.now{display:flex;gap:10px;flex-wrap:wrap;align-items:end;margin:6px 0 4px;padding:12px 14px;background:rgba(255,255,255,.8);border-radius:18px;border:1.5px dashed #b6aed3}
.now label{display:grid;font-size:12.5px;color:var(--dim);gap:2px}.now input{width:118px;font-size:17px}
.paper{position:relative;background:var(--paper);border-radius:6px 28px 6px 28px;padding:34px 20px 22px;margin:26px 0;box-shadow:0 22px 40px -26px rgba(38,52,138,.55),0 0 0 1.5px #ecdcc4;overflow:hidden}
.paper::before{content:"";position:absolute;left:-10%;right:-10%;top:0;height:14px;background:repeating-linear-gradient(115deg,var(--ora) 0 22px,var(--navy) 22px 44px)}
.paper h2{margin:0 0 12px;font:800 24px var(--f);letter-spacing:.14em;position:relative}
.paper h2 em{font:italic 600 14px var(--en);letter-spacing:.2em;color:var(--dim);margin-left:10px}
.orn{position:absolute;right:-18px;top:6px;width:190px;height:150px;pointer-events:none;opacity:.55}

.paper>*{position:relative}.paper>.orn{position:absolute}

.c:hover{background:#fff;color:var(--ink);transform:translateY(-2px)}
.c small{font-size:11px;color:#7d6f90;white-space:nowrap}.c b{font-size:clamp(11px,2.8vw,15px);font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:clip}
.c.r{background:linear-gradient(#fff,#ffe9df);border-color:#f1b9a3}.c.r b{color:var(--ora2)}
.c.m{border-style:dashed;background:transparent}.c.m b{color:#a090b0;font-weight:500}
.c.mg b::after{content:"合";font:700 9px var(--g);margin-left:2px;color:#9a6d10}
.c.f{background:#f4f0fb}.c.f b{font-style:italic;color:#5b4e8c;font-weight:500}
.c.t{border-color:var(--ora);box-shadow:0 0 0 3px rgba(255,107,61,.28)}
.c.s{outline:3px solid var(--navy);outline-offset:0}
.c .st{position:absolute;right:2px;top:2px;min-width:17px;height:17px;border:1.5px solid #d8402a;border-radius:50%;color:#d8402a;font:700 10px/14px var(--g);text-align:center;transform:rotate(-14deg);background:#fff}
.c .st.k{border-color:var(--navy);color:var(--navy)}
.det{margin-top:14px;border-top:2px dotted #b9a9c8;padding-top:12px}
.det h3{margin:0 0 8px;font:800 18px var(--f)}
.det .tiles{grid-template-columns:repeat(auto-fit,minmax(130px,1fr))}
.fm{display:flex;gap:8px;flex-wrap:wrap;align-items:end;margin-top:12px}.fm label{display:grid;font-size:12.5px;color:var(--dim);gap:2px}.fm input{width:150px}
.note{font-size:13px;color:var(--dim);margin:6px 0}
#chart{position:relative}#chart svg{display:block;width:100%;height:auto;touch-action:pan-y}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:#fff;padding:7px 11px;border-radius:12px;font-size:13px;line-height:1.5;transform:translate(-50%,-125%);white-space:nowrap;z-index:3}
.lg{display:flex;gap:6px 18px;flex-wrap:wrap;font-size:13px;color:var(--dim);margin:8px 0 0}.lg i{display:inline-block;width:26px;border-top:3px solid var(--ora);vertical-align:middle;margin-right:6px}
details.paper{padding:14px 20px;background:rgba(255,255,255,.7);border:1.5px solid #cfc6e4;border-radius:18px;box-shadow:none;overflow:visible}details.paper::before{display:none}details.paper .pg label,details.paper .note{color:#463f68}
summary{cursor:pointer;font:800 22px var(--f);letter-spacing:.14em;list-style:none;position:relative}summary::-webkit-details-marker{display:none}
.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px 16px;margin-top:14px}

.bz{grid-column:1/-1;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.lgs{grid-column:1/-1;max-height:240px;overflow:auto;border:1.5px solid var(--hair);border-radius:12px;background:#fff}
.lgs label{display:flex;gap:10px;align-items:center;padding:6px 12px;border-bottom:1px dotted var(--hair);font-size:13.5px;color:var(--ink)}
nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;justify-content:space-around;padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(255,249,241,.94);backdrop-filter:blur(8px);border-top:2px solid var(--navy)}
nav a{color:var(--navy);text-decoration:none;font-weight:700;font-size:14px;letter-spacing:.12em;padding:2px 8px}
.toast{position:fixed;left:50%;bottom:calc(76px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:99px;font-size:14px;z-index:60}
/* 落幕 */
#fin{position:fixed;inset:0;z-index:40;display:none;overflow:auto;text-align:center;color:#fff;background:radial-gradient(80vmax 60vmax at 50% 20%,#3a2f8f,transparent 70%),radial-gradient(50vmax 40vmax at 90% 100%,#8a2f6e,transparent 70%),linear-gradient(#0d1033,#1b1654 60%,#15103d)}
#fin.on{display:block}#fin .x{position:fixed;right:14px;top:calc(10px + env(safe-area-inset-top,0px));z-index:5;background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.5)}
.star{position:fixed;width:3px;height:3px;border-radius:50%;background:#fff;animation:tw 3s ease-in-out infinite;pointer-events:none}
.fwrap{position:relative;z-index:2;max-width:760px;margin:0 auto;padding:30px 14px 170px}
.moonhg{width:min(300px,76vw);height:auto;display:block;margin:6px auto 0;filter:drop-shadow(0 0 24px rgba(255,214,120,.55))}
.sandp{animation:sd 2.6s ease-in infinite}@keyframes sd{0%{transform:translateY(0);opacity:0}15%{opacity:1}100%{transform:translateY(64px);opacity:0}}
.gt{font:800 clamp(40px,11vw,76px)/1.1 var(--f);margin:6px 0;background:linear-gradient(#fff6c8,#f2c25a 60%,#d98a2b);-webkit-background-clip:text;background-clip:text;color:transparent;letter-spacing:.2em}
.kk{font:600 14px var(--en);font-style:italic;letter-spacing:.4em;color:#cfc6ff}
.lans{display:flex;justify-content:space-between;gap:2px;margin:6px auto 0;max-width:640px;position:relative}
.lans:before{content:"";position:absolute;left:0;right:0;top:0;border-top:2px solid rgba(255,214,120,.7)}
.lan{background:none;border:0;padding:0;width:19%;color:#fff;position:relative;transform-origin:50% 0;animation:swing 4s ease-in-out infinite}
.lan:nth-child(2){animation-delay:-.7s}.lan:nth-child(3){animation-delay:-1.4s}.lan:nth-child(4){animation-delay:-2.1s}.lan:nth-child(5){animation-delay:-2.8s}

.lan:hover{background:none}.lan svg{width:100%;height:auto;display:block}
.lan .bd{fill:#ffd9c2;transition:fill .5s}.lan.on .bd{fill:#ff7a45}.lan .gl{opacity:0;transition:opacity .5s}.lan.on .gl{opacity:.95;animation:glow 2s ease-in-out infinite}@keyframes glow{50%{opacity:.5}}
.lan span{display:block;font:700 13px var(--f);letter-spacing:.2em;color:#ffe9b8;margin-top:-4px}
.fp{margin:14px auto;max-width:620px;background:var(--paper);color:var(--ink);border-radius:6px 26px 6px 26px;padding:22px;text-align:left;box-shadow:0 20px 50px -20px rgba(0,0,0,.7),0 0 0 3px rgba(230,176,74,.8);animation:pop .5s}
@keyframes pop{from{transform:translateY(16px) scale(.95);opacity:0}}
.fp h3{margin:0 0 6px;font:800 22px var(--f)}.fp .bn{font:800 clamp(36px,10vw,60px)/1.1 var(--f);color:var(--ora)}
.pill{display:block;margin:8px 0;padding:8px 12px;border-radius:14px;background:#fff;border:1.5px solid var(--navy);animation:pop .5s backwards}.pill b{font:800 18px var(--f);color:var(--navy)}.pill i{display:block;font-style:normal;font-size:12px;letter-spacing:.2em;color:var(--ora)}.pill span{display:block;font-size:13px;color:var(--dim)}
.dr{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2.6s ease forwards}@keyframes dr{to{stroke-dashoffset:0}}
.tube{width:130px;height:auto;display:block;margin:6px auto}.tube.sh{animation:shk .16s ease-in-out 7}@keyframes shk{0%,100%{transform:rotate(-9deg)}50%{transform:rotate(9deg)}}
.stk{transition:transform .8s cubic-bezier(.3,1.6,.5,1)}.tube.up .stk{transform:translateY(-34px)}
.omi{position:relative;width:min(280px,82vw);margin:12px auto;background:linear-gradient(#fffdf6,#fff1dd);border-radius:10px;padding:16px 16px 18px;color:var(--ink);box-shadow:0 0 0 3px var(--gold),0 0 0 7px #fff,0 0 0 9px var(--ora),0 24px 40px -10px rgba(0,0,0,.6);transform-origin:50% 0;animation:unroll 1.1s cubic-bezier(.2,.8,.3,1) both;overflow:hidden}
@keyframes unroll{0%{transform:scaleY(.04);opacity:0}30%{opacity:1}100%{transform:scaleY(1)}}
.omi .hd{background:var(--navy);color:#fff;font:800 16px var(--f);letter-spacing:.5em;padding:4px 0 4px .5em;border-radius:4px}

.omi .lv{font:800 78px/1 var(--f);letter-spacing:.06em;margin:4px 0 10px;-webkit-text-stroke:2px #fff;paint-order:stroke fill;text-shadow:4px 4px 0 var(--gold)}
.omi ul{list-style:none;padding:0;margin:0;text-align:left}.omi li{display:grid;grid-template-columns:3em 1fr;gap:6px;padding:6px 0;border-top:1px dotted #d9c6a8;font-size:13.5px;line-height:1.55}.omi li b{font:800 14px var(--f);color:var(--ora2);letter-spacing:.2em}
.omi .lk{margin-top:8px;font-size:13px;color:var(--navy);font-weight:700}
.omi .sk{position:absolute;opacity:.35;pointer-events:none}
.cimg{max-width:min(420px,92%);border-radius:10px;box-shadow:0 0 0 3px rgba(230,176,74,.9),0 24px 50px -10px rgba(0,0,0,.8);margin-top:14px}
.fbot{position:fixed;left:0;right:0;bottom:0;z-index:1;pointer-events:none;height:150px}
.fbot svg{position:absolute;left:0;bottom:44px;width:100%;height:110px}
.film{position:absolute;left:0;right:0;bottom:0;height:46px;background:#f5f3ff;background-image:linear-gradient(#2b2a55 0 0),linear-gradient(#2b2a55 0 0);background-size:100% 7px,100% 7px;background-position:0 0,0 100%;background-repeat:no-repeat}
.film:after{content:"";position:absolute;inset:3px 0;background:repeating-linear-gradient(90deg,#2b2a55 0 10px,transparent 10px 24px);opacity:.9;clip-path:inset(0 0 calc(100% - 4px) 0)}
@media(max-width:760px){.hero{grid-template-columns:1fr;gap:20px}.cartw{max-width:330px;margin:0 auto;width:100%}.rib{top:18%}.cdp{box-shadow:6px 6px 0 var(--ora)}.c{height:50px}.c small{font-size:10px}.cal{gap:3px}.orn{width:130px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.dr{stroke-dashoffset:0}}
/* ---- v3 ---- */
#pet{position:fixed;inset:0;z-index:3;pointer-events:none;overflow:hidden}
#pet b{position:absolute;top:-40px;display:block;animation:pfall linear infinite;opacity:.8}
#pet i{display:block;width:100%;height:100%;background:var(--pt) center/contain no-repeat;animation:psway ease-in-out infinite alternate;filter:drop-shadow(0 1px 1px rgba(224,101,140,.25))}
@keyframes pfall{to{transform:translate3d(var(--dx),112vh,0)}}

.cdt div{container-type:inline-size}
.cdt b{font-size:min(64px,34cqw)!important;white-space:nowrap}.cdt b.l3{font-size:min(64px,25cqw)!important}
.cdt span{font-size:12px}
.tb{height:5px}.tbl{font-size:11.5px}
.dic{position:relative;margin:0;background:rgba(255,252,246,.95);border:1.5px solid var(--navy);border-radius:6px;padding:14px 18px 8px 66px;box-shadow:8px 8px 0 rgba(255,107,61,.85)}
.dic .tag{position:absolute;left:12px;top:12px;bottom:12px;width:38px;background:var(--navy);color:#fff;writing-mode:vertical-rl;font:800 21px var(--f);letter-spacing:.3em;display:grid;place-items:center}
.dic .r{display:grid;grid-template-columns:6.5em 1fr;gap:2px 12px;padding:8px 0;border-bottom:1.5px dotted #b6aed3}

.dic dt{color:var(--dim);font-size:13px;align-self:center;margin:0}.dic dd{margin:0;font:800 20px/1.3 var(--f);font-variant-numeric:tabular-nums;min-width:0}
